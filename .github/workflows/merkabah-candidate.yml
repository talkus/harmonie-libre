name: Merkabah candidate checks
on:
  pull_request:
    paths:
      - "merkabah/**"
      - ".github/workflows/merkabah-candidate.yml"
  push:
    paths:
      - "merkabah/**"
      - ".github/workflows/merkabah-candidate.yml"
  workflow_dispatch:
jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "networkx>=3.3,<4"
      - run: python -m unittest discover -s merkabah/tests -v
