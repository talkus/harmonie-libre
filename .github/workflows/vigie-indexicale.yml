name: Vigie Indexicale — témoin expérimental
on:
  pull_request:
    paths:
      - 'experiments/vigie-indexicale/**'
      - '.github/workflows/vigie-indexicale.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contre-épreuves du témoin indépendant
        run: node --test experiments/vigie-indexicale/witness/tests/verify.test.mjs