name: Reliability Gate - proof boundary

on:
  pull_request:
    paths:
      - 'reliability_gate/**'
      - '.github/workflows/reliability-gate.yml'
  push:
    paths:
      - 'reliability_gate/**'
      - '.github/workflows/reliability-gate.yml'

permissions:
  contents: read

jobs:
  shadow-only-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test deterministically
        run: |
          python -m compileall -q reliability_gate
          python -m unittest discover -s reliability_gate/tests -v
      - name: Verify example remains shadow-only
        run: |
          python -m reliability_gate.cli evaluate reliability_gate/fixtures/example.json --ledger /tmp/reliability-receipts.jsonl
          python -m reliability_gate.cli verify /tmp/reliability-receipts.jsonl
