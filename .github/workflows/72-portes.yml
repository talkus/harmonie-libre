name: 72 portes canonical v1.1.1
on:
  pull_request:
    paths:
      - 'projects/72-portes/**'
      - '.github/workflows/72-portes.yml'
  push:
    paths:
      - 'projects/72-portes/**'
      - '.github/workflows/72-portes.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical CSV SHA-256 and all cross-table invariants
        run: python3 projects/72-portes/valider.py
