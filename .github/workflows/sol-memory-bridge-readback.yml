name: Sol Memory Bridge — verified write/readback
on:
  pull_request:
    paths:
      - 'sol-memory-bridge/**'
      - '.github/workflows/sol-memory-bridge-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test write-readback non-replay gate without secrets
        run: node --test sol-memory-bridge/tests/*.test.cjs
      - name: Validate Edge source syntax boundary
        run: |
          node --check sol-memory-bridge/bridge-write-protocol.js
          node --check sol-memory-bridge/tests/write-receipt.test.cjs
