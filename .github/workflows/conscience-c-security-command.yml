name: Conscience C Security Command

on:
  push:
    paths:
      - "conscience-c/**"
      - "SECURITY_COMMAND.md"
      - "security-command/**"
      - "security-command/project-registry.json"
      - "security/security-command-policy.json"
      - "memory/harmonization/CONSCIENCE_C_GLOBAL_SECURITY_COMMAND.md"
      - ".github/workflows/conscience-c-security-command.yml"
  pull_request:
    paths:
      - "conscience-c/**"
      - "SECURITY_COMMAND.md"
      - "security-command/**"
      - "security/security-command-policy.json"
      - "memory/harmonization/CONSCIENCE_C_GLOBAL_SECURITY_COMMAND.md"
      - ".github/workflows/conscience-c-security-command.yml"

jobs:
  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conscience-c/brain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
