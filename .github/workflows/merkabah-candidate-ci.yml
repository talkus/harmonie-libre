name: Merkabah candidate structural tests
on:
  push:
    paths:
      - 'merkabah/**'
      - '.github/workflows/merkabah-candidate-ci.yml'
  pull_request:
    paths:
      - 'merkabah/**'
      - '.github/workflows/merkabah-candidate-ci.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'networkx>=3.2,<4'
      - run: python -m unittest discover -s merkabah/tests -p 'test*.py' -v
